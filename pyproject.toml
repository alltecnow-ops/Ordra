[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ordra"
version = "1.0.0"
description = "Ordra — the world's smartest file organizer"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.12,<1.0",
    "rich>=13,<15",
    "anthropic>=0.40,<2.0",
    "send2trash>=1.8,<2.0",
]

[project.urls]
Homepage = "https://github.com/alltecnow-ops/ordra"
Repository = "https://github.com/alltecnow-ops/ordra"
"Bug Tracker" = "https://github.com/alltecnow-ops/ordra/issues"

[project.scripts]
ordra = "file_organizer.cli:app"
ordra-tui = "file_organizer.tui.app:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]
tui = ["textual>=0.60,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["file_organizer"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["file_organizer*"]
